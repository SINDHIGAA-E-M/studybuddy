<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyBuddy – Students</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<nav>
  <a class="brand" href="index.html">📚 StudyBuddy</a>
  <a href="index.html">Dashboard</a>
  <a href="students.html" class="active">Students</a>
  <a href="subjects.html">Subjects</a>
  <a href="groups.html">Groups</a>
  <a href="join.html">Join Group</a>
</nav>

<div class="container">
  <h2>Student Management</h2>

  <div class="form-card">
    <div class="form-row">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="sName" placeholder="Enter student name"/>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="sEmail" placeholder="Enter email"/>
      </div>
      <div style="display:flex;align-items:flex-end;gap:8px;">
        <button class="btn btn-primary" onclick="saveStudent()">Save Student</button>
        <button class="btn btn-outline" onclick="cancelEdit()" id="cancelBtn" style="display:none">Cancel</button>
      </div>
    </div>
    <div id="formError" style="color:#ea4335;font-size:0.85rem;margin-top:4px;"></div>
  </div>

  <div class="section-header">
    <h2>All Students</h2>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
      <tbody id="studentTable"><tr><td colspan="4">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Edit Student</h3>
    <div class="form-group" style="margin-bottom:12px;">
      <label>Name *</label>
      <input type="text" id="editName"/>
    </div>
    <div class="form-group" style="margin-bottom:12px;">
      <label>Email *</label>
      <input type="email" id="editEmail"/>
    </div>
    <div id="editError" style="color:#ea4335;font-size:0.85rem;margin-bottom:8px;"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitEdit()">Update</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let editId = null;

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + type;
  setTimeout(() => t.className = '', 3000);
}

async function loadStudents() {
  const res = await fetch('/students');
  const data = await res.json();
  const tbody = document.getElementById('studentTable');
  if (!data.length) { tbody.innerHTML = '<tr><td colspan="4">No students found</td></tr>'; return; }
  tbody.innerHTML = data.map(s => `
    <tr>
      <td>${s.id}</td><td>${s.name}</td><td>${s.email}</td>
      <td>
        <button class="btn btn-warning btn-sm" onclick="openEdit(${s.id},'${s.name}','${s.email}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteStudent(${s.id},'${s.name}')">Delete</button>
      </td>
    </tr>`).join('');
}

async function saveStudent() {
  const name = document.getElementById('sName').value.trim();
  const email = document.getElementById('sEmail').value.trim();
  const err = document.getElementById('formError');
  if (!name) { err.textContent = 'Name is required'; return; }
  if (!email) { err.textContent = 'Email is required'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Enter a valid email'; return; }
  err.textContent = '';
  const res = await fetch('/students', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name, email})
  });
  const data = await res.json();
  if (!res.ok) { err.textContent = data.message || 'Error'; return; }
  document.getElementById('sName').value = '';
  document.getElementById('sEmail').value = '';
  showToast('Student added successfully');
  loadStudents();
}

function openEdit(id, name, email) {
  editId = id;
  document.getElementById('editName').value = name;
  document.getElementById('editEmail').value = email;
  document.getElementById('editError').textContent = '';
  document.getElementById('editModal').classList.add('show');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('show');
  editId = null;
}

async function submitEdit() {
  const name = document.getElementById('editName').value.trim();
  const email = document.getElementById('editEmail').value.trim();
  const err = document.getElementById('editError');
  if (!name) { err.textContent = 'Name is required'; return; }
  if (!email) { err.textContent = 'Email is required'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Enter a valid email'; return; }
  err.textContent = '';
  const res = await fetch(`/students/${editId}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name, email})
  });
  const data = await res.json();
  if (!res.ok) { err.textContent = data.message || 'Error'; return; }
  closeModal();
  showToast('Student updated successfully');
  loadStudents();
}

async function deleteStudent(id, name) {
  if (!confirm(`Delete student "${name}"? Their group memberships will also be removed.`)) return;
  const res = await fetch(`/students/${id}`, { method: 'DELETE' });
  const data = await res.json();
  showToast(data.message, res.ok ? 'success' : 'error');
  if (res.ok) loadStudents();
}

function cancelEdit() {}

loadStudents();
</script>
</body>
</html>
